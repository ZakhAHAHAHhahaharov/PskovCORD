# Продовый стек. Запускать из корня репозитория:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# Переменные POSTGRES_* / APP_NAME берутся из корневого .env (не в git).
# backend/.env (не в git) содержит Django/TURN секреты.
name: pskovcord

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    # host-сеть: relay-порты нужно принимать напрямую на публичном IP,
    # без docker NAT — иначе пришлось бы прокидывать весь диапазон через iptables.
    network_mode: host
    command:
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--realm=pskord.zlgvpn.org"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--external-ip=94.26.90.101"
      - "--fingerprint"
      - "--no-cli"
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file: ../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Публично не торчит — nginx на хосте проксирует сюда с TLS.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
