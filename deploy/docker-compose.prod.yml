# Продовый стек. Запускать из корня репозитория:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# Переменные POSTGRES_* / APP_NAME берутся из корневого .env (не в git).
# backend/.env (не в git) содержит Django/TURN секреты.
name: pskovcord

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  coturn:
    # Тег зафиксирован: с :latest каждая пересборка (то есть каждый push в
    # main, см. deploy/deploy.sh) могла подтянуть в прод другую версию coturn.
    image: coturn/coturn:4.15.0
    # host-сеть: relay-порты нужно принимать напрямую на публичном IP,
    # без docker NAT — иначе пришлось бы прокидывать весь диапазон через iptables.
    network_mode: host
    command:
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--realm=pskord.zlgvpn.org"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--external-ip=94.26.90.101"
      - "--fingerprint"
      - "--no-cli"
    restart: unless-stopped

  sfu:
    # Медиа-сервер голоса (mediasoup). Клиент держит к нему один WebRTC-транспорт,
    # SFU разветвляет потоки остальным участникам канала.
    build:
      context: ../sfu
    # host-сеть по той же причине, что у coturn: медиа-диапазон портов нужно
    # принимать напрямую на публичном IP, без docker NAT.
    network_mode: host
    environment:
      # Сигналинг слушаем только на localhost — наружу его проксирует nginx (wss).
      SFU_LISTEN_HOST: "127.0.0.1"
      SFU_LISTEN_PORT: "4443"
      # Один секрет на Django и SFU — берётся из корневого .env. Фолбэка нет
      # намеренно: раньше здесь стоял `:-dev-insecure-sfu-secret`, то есть при
      # незаданной переменной обе стороны молча сходились на секрете из
      # .env.example, и кто угодно мог подписать себе токен в любую комнату.
      # Теперь compose упадёт с внятной ошибкой на старте.
      SFU_SECRET: ${SFU_SECRET:?SFU_SECRET обязателен — openssl rand -hex 32}
      # IP, который SFU сообщает клиентам в ICE-кандидатах.
      SFU_ANNOUNCED_IP: ${SFU_ANNOUNCED_IP:-94.26.90.101}
      SFU_RTC_MIN_PORT: ${SFU_RTC_MIN_PORT:-40000}
      SFU_RTC_MAX_PORT: ${SFU_RTC_MAX_PORT:-40100}
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file: ../backend/.env
    environment:
      # Прод-значения голоса задаём здесь (перекрывают backend/.env), чтобы не
      # приходилось править файл на сервере руками:
      # клиент ходит на SFU через nginx по тому же домену (wss, без mixed content).
      SFU_PUBLIC_URL: ${SFU_PUBLIC_URL:-wss://pskord.zlgvpn.org/sfu}
      SFU_SECRET: ${SFU_SECRET:?SFU_SECRET обязателен — openssl rand -hex 32}
      # TURN_SECRET раньше приезжал сюда только из backend/.env (через
      # env_file), а в coturn — из корневого .env. Стоило файлам разойтись, и
      # Django подписывал TURN-credentials одним ключом, а coturn проверял
      # другим: relay тихо переставал работать без внятной причины. Теперь
      # оба сервиса берут его из одного места — корневого .env.
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET обязателен — openssl rand -hex 32}
      # Потоки ASGI и постоянные соединения с Postgres — связанная пара:
      # каждый поток держит своё соединение (см. CONN_MAX_AGE в
      # config/settings.py), а у Postgres max_connections по умолчанию 100.
      # Значения по умолчанию проставляет backend/entrypoint.sh — здесь они
      # только для того, чтобы их можно было переопределить из .env, не
      # пересобирая образ.
      ASGI_THREADS: ${ASGI_THREADS:-16}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Публично не торчит — nginx на хосте проксирует сюда с TLS.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # collectstatic (см. backend.Dockerfile) кладёт файлы сюда при сборке
      # образа; хостовый nginx отдаёт /static/ напрямую отсюда же — см.
      # deploy/nginx.conf.example. Путь на хосте: ./staticfiles рядом с этим
      # compose-файлом, т.е. /opt/pskovcord/deploy/staticfiles.
      - ./staticfiles:/app/backend/staticfiles
      # Загруженные favicon-наборы (core.models.Favicon.MEDIA_ROOT) — тем же
      # приёмом, что staticfiles выше: хостовый nginx отдаёт /media/ отсюда
      # же напрямую (см. deploy/nginx.conf.example), без похода в Django.
      - ./media:/app/backend/media
    restart: unless-stopped
    # Процесс живой, а event loop мёртвый — штатная беда одного ASGI-процесса:
    # контейнер при этом продолжает «работать», restart: unless-stopped не
    # срабатывает, и наружу это выглядит как молчащий сайт. healthcheck ходит
    # на /healthz (core.views.healthz) и даёт Docker'у повод перезапустить.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      # Миграции и collectstatic на старте занимают время — до их конца
      # проверка не должна считаться провалом.
      start_period: 60s
    # Daphne по SIGTERM закрывает WebSocket'ы штатным close-фреймом, и клиент
    # переподключается сразу, не досиживая backoff. 10 секунд по умолчанию на
    # это хватает не всегда — а не успевший закрыться сокет клиент считает
    # мёртвым только по своему watchdog'у, то есть на десяток секунд позже.
    stop_grace_period: 30s

volumes:
  postgres_data:
  redis_data:
