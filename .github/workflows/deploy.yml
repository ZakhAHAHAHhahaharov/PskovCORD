name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Деплой раньше не зависел от тестов вообще: CI тригерился на PR и на push в
  # dev, а этот воркфлоу — на push в main, независимо. То есть ничто не мешало
  # перевести прод на коммит, для которого тесты не проходили.
  ci:
    name: CI (обязательное условие деплоя)
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Дефолт appleboy/ssh-action — 10m. Сборка sfu (npm ci) без кэша
          # слоя (после бампа package-lock.json, см. Dependabot) сама по
          # себе уже занимала ~11-12 минут — см. инцидент 2026-09-15, где
          # именно на этом шаге деплой оборвался по таймауту, а не по ошибке
          # сборки.
          command_timeout: 25m
          script: bash /opt/pskovcord/deploy/deploy.sh
