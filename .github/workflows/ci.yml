name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  # Позволяет вызывать этот воркфлоу из deploy.yml как обязательное условие
  # (needs: ci) — раньше деплой уходил на прод, не дожидаясь тестов вовсе.
  workflow_call: {}

jobs:
  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Линтера в проекте не было вовсе, при том что в коде стояли
      # eslint-disable-комментарии — правило, которое они подавляют, никто не
      # проверял (см. web/eslint.config.js).
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

  backend:
    name: backend (check + migrate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pskovcord
          POSTGRES_USER: pskovcord
          POSTGRES_PASSWORD: pskovcord
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pskovcord -d pskovcord"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_NAME: PskovCord
      POSTGRES_DB: pskovcord
      POSTGRES_USER: pskovcord
      POSTGRES_PASSWORD: pskovcord
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-secret-key-not-for-prod
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python manage.py migrate --noinput
        working-directory: backend
      - run: python manage.py test
        working-directory: backend
      # Прод-конфигурация (DEBUG=0) до этого не проверялась ничем: тесты и
      # check гонялись только с DEBUG=1, так что ветка с обязательными
      # секретами, Secure-cookie и CORS могла сломаться незамеченной.
      - name: check --deploy (прод-конфигурация)
        working-directory: backend
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-secret-key-0123456789abcdefghijklmnopqrstuvwxyz-not-for-prod
          DJANGO_ALLOWED_HOSTS: example.com
          POSTGRES_PASSWORD: ci-only-postgres-password
          TURN_SECRET: ci-only-turn-secret-0123456789abcdef
          SFU_SECRET: ci-only-sfu-secret-0123456789abcdef
        run: python manage.py check --deploy --fail-level ERROR

  sfu:
    name: sfu (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sfu/package-lock.json
      - run: npm ci
        working-directory: sfu
      - run: npm run build
        working-directory: sfu
