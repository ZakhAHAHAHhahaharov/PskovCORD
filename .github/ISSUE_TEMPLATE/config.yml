# blank_issues_enabled: пустую issue завести всё ещё можно — шаблоны здесь
# помогают, а не загораживают вход. Внутренние заметки по рефакторингу в
# форму «шаги воспроизведения» не укладываются, и заставлять их туда лезть
# значит получить issue, заполненную прочерками.
blank_issues_enabled: true
contact_links:
  - name: Нашли уязвимость
    url: https://github.com/ZakhAHAHAHhahaharov/PskovCORD/security/advisories/new
    about: >-
      НЕ заводите публичную issue. Репозиторий открыт, и описание рабочей дыры
      в нём — готовая инструкция для любого, кто читает ленту. Приватный
      advisory виден только вам и владельцу репозитория (см. SECURITY.md).
  - name: Сообщить о проблеме прямо из приложения
    url: https://pskord.zlgvpn.org
    about: >-
      Кнопка «Сообщить о проблеме» в самом клиенте приложит версию, браузер и
      последние ошибки автоматически — от вас не потребуется ничего собирать
      руками.
