# PskovCord — локальный стек. Тот же compose деплоим на сервер.
# Запуск:  docker compose up --build
name: pskovcord

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    command:
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--realm=pskovcord.local"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"

  sfu:
    build: ./sfu
    env_file: .env
    # host-сеть — как у coturn: mediasoup'у нужны прямой UDP/TCP-диапазон
    # (SFU_RTC_MIN_PORT..MAX_PORT) и реальный announcedIp, а не bridge-NAT.
    # Слушает WS-сигналинг на SFU_LISTEN_PORT (по умолчанию 4443).
    network_mode: host

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
      VITE_APP_NAME: ${APP_NAME}
    volumes:
      - ./web:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
